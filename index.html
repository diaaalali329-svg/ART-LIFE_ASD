<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART LIFE - الصفحة الرئيسية</title>
    <style>
        /* ================= الهوية البصرية الموحدة (Dark Theme) ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-section {
            padding: 40px 20px;
            max-width: 800px;
        }

        .hero-section h1 {
            color: #38bdf8;
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .hero-section p {
            color: #94a3b8;
            font-size: 1.3rem;
            margin-bottom: 50px;
            line-height: 1.6;
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* تصميم أزرار التنقل */
        .nav-btn {
            background-color: #1e293b;
            color: #e2e8f0;
            border: 2px solid #334155;
            padding: 15px 35px;
            font-size: 1.2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .nav-btn:hover {
            transform: translateY(-5px);
            background-color: #0f172a;
        }

        /* تمييز زر بدء التحليل (الزر الرئيسي) */
        .btn-start {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        }

        .btn-start:hover {
            background-color: transparent;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="hero-section">
        <h1>ART LIFE</h1>
        <p>مرحباً بك في مستشارك الشخصي للأزياء. دع الذكاء الاصطناعي يختار لك أفضل ستايل يومي بناءً على صور ملابسك.</p>
        
        <div class="nav-buttons">
            <!-- هذا الزر سينقلنا للواجهة الجديدة المخصصة لرفع الصور -->
            <a href="analyze.html" class="nav-btn btn-start">✨ ابدأ اختيار الأزياء</a>
            
            <!-- روابط الصفحات الأخرى التي جهزناها سابقاً -->
            <a href="subscibe.html" class="nav-btn">⭐ خطط الاشتراك</a>
            <a href="contact.html" class="nav-btn">🎧 خدمة العملاء</a>
        </div>
    </div>

</body>
</html>
