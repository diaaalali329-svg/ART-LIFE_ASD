<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART LIFE - خدمة العملاء</title>
    <style>
        /* ================= CSS (التصميم العصري الموحد - Dark Theme) ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); /* خلفية داكنة متناسقة مع الموقع */
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* تصميم قسم الترحيب (الهيدر) */
        .header {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 50px;
            padding: 0 20px;
        }

        .header h1 {
            color: #38bdf8; /* أزرق نيون مشع */
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
        }

        .header p {
            color: #94a3b8;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* حاوية البطاقات */
        .contact-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            padding: 20px;
        }

        /* تصميم البطاقة الواحدة (Card) مع تأثير الزجاج الملون */
        .contact-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px 30px;
            width: 280px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* تأثيرات الإضاءة عند تمرير الماوس (Hover) */
        .contact-card:hover {
            transform: translateY(-15px);
            background-color: #0f172a;
        }

        .contact-card:nth-child(1):hover { border-color: #10b981; box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2); } /* أخضر للاتصال */
        .contact-card:nth-child(2):hover { border-color: #f43f5e; box-shadow: 0 15px 40px rgba(244, 63, 94, 0.2); } /* أحمر للإيميل */
        .contact-card:nth-child(3):hover { border-color: #d946ef; box-shadow: 0 15px 40px rgba(217, 70, 239, 0.2); } /* وردي للإنستغرام */

        /* الأيقونات الدائرية */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: #0f172a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 2.5rem;
            border: 2px solid #334155;
            transition: all 0.3s ease;
        }

        .contact-card:hover .icon-wrapper {
            transform: scale(1.1) rotate(10deg);
        }

        .contact-card h3 {
            color: #e2e8f0;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .contact-card p {
            color: #94a3b8;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 30px;
            direction: ltr; /* لضبط شكل الأرقام والروابط الإنجليزية */
            letter-spacing: 1px;
        }

        /* تصميم أزرار الإجراء السريع */
        .action-btn {
            display: block;
            width: 100%;
            background-color: transparent;
            color: #f8fafc;
            text-decoration: none;
            padding: 12px 0;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* تخصيص ألوان الأزرار */
        .btn-call { border: 2px solid #10b981; color: #10b981; }
        .btn-call:hover { background-color: #10b981; color: #0f172a; }

        .btn-email { border: 2px solid #f43f5e; color: #f43f5e; }
        .btn-email:hover { background-color: #f43f5e; color: #0f172a; }

        .btn-insta { border: 2px solid #d946ef; color: #d946ef; }
        .btn-insta:hover { background-color: #d946ef; color: #0f172a; }

        /* زر العودة للرئيسية */
        .back-home {
            margin-top: 50px;
            margin-bottom: 50px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 30px;
            border: 2px solid #334155;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .back-home:hover {
            background-color: #38bdf8;
            border-color: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

        <!-- 3. بطاقة إنستغرام -->

    <!-- زر العودة -->

</html>
