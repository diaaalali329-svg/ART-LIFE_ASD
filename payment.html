<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART LIFE - إتمام الدفع</title>
    <style>
        /* ================= CSS (تصميم واجهة الدفع) ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .payment-container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .payment-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #10b981, #38bdf8);
        }

        .header h1 {
            font-size: 2rem;
            color: #f8fafc;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .header p {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* حاوية شام كاش */
        .cham-cash-box {
            background-color: #0f172a;
            border: 2px dashed #38bdf8;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            transition: transform 0.3s ease;
        }

        .cham-cash-box:hover {
            transform: scale(1.02);
            border-color: #10b981;
        }

        .cham-cash-logo {
            color: #10b981;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .qr-image {
            width: 200px;
            height: 200px;
            border: 8px solid white;
            border-radius: 15px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* تصميم نماذج الإدخال */
        .form-group {
            text-align: right;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #38bdf8;
        }

        /* تصميم زر رفع الإشعار */
        .upload-btn {
            display: inline-block;
            width: 100%;
            padding: 12px 15px;
            background-color: #334155;
            color: #38bdf8;
            border: 1px dashed #38bdf8;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .upload-btn:hover {
            background-color: #475569;
            border-style: solid;
        }

        input[type="file"] {
            display: none;
        }

        /* معاينة الإشعار */
        #receipt-preview-container {
            display: none;
            margin-top: 15px;
            text-align: center;
            background-color: #0f172a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        #receipt-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            object-fit: contain;
        }

        /* زر التأكيد */
        .confirm-btn {
            background: linear-gradient(90deg, #38bdf8, #2563eb);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-top: 10px;
        }

        .confirm-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="payment-container">
        
        <div class="header">
            <h1>إتمام عملية الدفع</h1>
            <p>يرجى مسح رمز الاستجابة السريعة باستخدام تطبيق <strong>شام كاش</strong> وإرفاق بيانات التحويل.</p>
        </div>

        <div class="cham-cash-box">
            <div class="cham-cash-logo">
                <span>📱</span> دفع آمن عبر شام كاش
            </div>
            <!-- تأكد من وجود الصورة QR.png -->
            <img src="qr.png" alt="QR CodE شام كاش" class="qr-image">
        </div>

        <!-- ================= التعديل الهندسي الذكي للتحايل على Formspree ================= -->
        <!-- أزلنا enctype="multipart/form-data" لكي لا يتم تصنيف الطلب كملفات -->
        <form action="https://formspree.io/f/mwlkpdob" method="POST" id="payment-form">
            
            <div class="form-group">
                <label for="transaction-id">رقم عملية التحويل (الإشعار):</label>
                <input type="text" id="transaction-id" name="transaction_id" placeholder="أدخل رقم العملية المكون من عدة أرقام" required>
            </div>

            <div class="form-group">
                <label for="sender-name">اسم المرسل (كما هو في التطبيق):</label>
                <input type="text" id="sender-name" name="sender_name" placeholder="أدخل الاسم الثلاثي" required>
            </div>

            <div class="form-group">
                <label>صورة إشعار التحويل:</label>
                <label for="receipt-upload" class="upload-btn">📎 اضغط هنا لإرفاق صورة الإشعار</label>
                <!-- أزلنا السمة name لكي لا يحاول المتصفح إرسال الصورة للخادم -->
                <input type="file" id="receipt-upload" accept="image/*">
                
                <div id="receipt-preview-container">
                    <img id="receipt-preview" src="" alt="معاينة الإشعار">
                </div>
            </div>

            <button type="submit" class="confirm-btn">تأكيد الدفع وإرسال الطلب 🚀</button>
        </form>

        <a href="subscibe.html" class="back-link">⬅️ تراجع واختيار باقة أخرى</a>

    </div>

    <!-- ================= JavaScript ================= -->
    <script>
        const receiptUpload = document.getElementById('receipt-upload');
        const receiptPreviewContainer = document.getElementById('receipt-preview-container');
        const receiptPreview = document.getElementById('receipt-preview');
        const paymentForm = document.getElementById('payment-form');

        // 1. معاينة الصورة للمستخدم (لكي يطمئن أنه رفعها بنجاح)
        receiptUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    receiptPreview.src = e.target.result;
                    receiptPreviewContainer.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        // 2. التحقق من صحة الإدخال (Validation) قبل الإرسال الفعلي
        paymentForm.addEventListener('submit', function(event) {
            // نمنع الإرسال إذا كان المستخدم لم يرفع أي صورة في الواجهة
            if (!receiptUpload.files[0]) {
                event.preventDefault(); // إيقاف الإرسال
                alert('عذراً! يرجى إرفاق صورة إشعار التحويل قبل تأكيد الدفع.');
            }
            // إذا كانت الصورة موجودة، سيكمل المتصفح الإرسال (ولكنه سيرسل النصوص فقط بفضل تعديلنا الذكي)
        });
    </script>
</body>
</html>
